name: Rust Coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  coveralls:
    name: Coveralls
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout isotope repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ../av.db/data/isotopes ../av.db/data/radioisotopes
          scripts/sync-isotope-checkouts.sh

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Verify coverage fixtures
        run: |
          /usr/bin/python3 scripts/generate-coverage-fixtures.py
          git diff --exit-code -- \
            data/combined.json \
            src/lib/rs/fixtures/coverage-combined.json

      - name: Generate Rust coverage
        env:
          AUTOMIC_VAULT_INCLUDE_ISOTOPE_TESTS: "1"
        run: >
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          -- --test-threads=1

      - name: Verify isotope coverage paths
        run: |
          grep -Eq '^SF:.*/data/isotopes/.+\.rs$' lcov.info
          grep -Eq '^SF:.*/data/radioisotopes/.+\.rs$' lcov.info

      - name: Upload Rust coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
