name: Rust Coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

env:
  TEAM_IDENTIFIER: AB12A12ABC  # stops tests failing

jobs:
  coveralls:
    name: Coveralls
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Verify coverage fixtures
        run: |
          /usr/bin/python3 scripts/generate-coverage-fixtures.py
          git diff --exit-code -- \
            data/combined.json \
            src/lib/rs/fixtures/coverage-combined.json

      - name: Install debug package database
        run: |
          sudo mkdir -p /var/db/automic-vault
          sudo cp data/combined.json /var/db/automic-vault/db.json

      - name: Sync isotope checkouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-isotope-checkouts.sh

      - name: Generate Rust coverage
        run: >
          cargo llvm-cov --workspace --no-cfg-coverage --lcov --output-path lcov.info
          -- --test-threads=1

      - name: Trust Coveralls Homebrew tap
        run: brew trust coverallsapp/coveralls

      - name: Upload Rust coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
