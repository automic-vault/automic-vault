name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Run optimized tests
        run: cargo test --profile test-release --all-targets --all-features --locked

  swift:
    name: Swift
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test --package-path src/menu-helper --disable-automatic-resolution

      - name: Test menu helper executable boundaries
        run: scripts/test-menu-helper-self-checks.sh

      - name: Test Launcher Bundle runner
        run: scripts/test-launcher-bundle-runner.sh

      - name: Test Varlock plugin helper
        run: scripts/test-varlock-plugin-helper.sh
