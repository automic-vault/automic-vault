[package]
name = "nucleus"
version = "1.19.1"
edition = "2024"
autobins = false
build = "build.rs"

[workspace]
resolver = "3"

[features]
gold-release = []
packaged-db = []

[lib]
path = "src/lib/rs/lib.rs"

[[bin]]
name = "av"
path = "src/nucleus/main.rs"

[[bin]]
name = "scanner"
path = "src/scanner/main.rs"

[[bin]]
name = "nuke-helper"
path = "src/helper/main.rs"

[dependencies]
base64 = "0.22"
ecies = { version = "0.2", default-features = false, features = ["aes-rust", "std"] }
flate2 = "1"
indicatif = "0.17"
json5 = "0.4"
libc = "0.2"
rayon = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4.45"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "2", features = ["brotli"] }
urlencoding = "2"
walkdir = "2"

[build-dependencies]
cc = "1"
